<!-- Restore & Erase Brush Editor Modal -->
<div class="editor-modal-backdrop hidden" id="editorModal">
  <div class="editor-modal-window">
    <!-- Header -->
    <div class="editor-header">
      <div class="editor-header-left">
        <span class="editor-badge">KUAS RETOUCH</span>
        <div class="editor-title-group">
          <h3 id="editorFileName">Gambar.png</h3>
          <span class="editor-dims" id="editorFileDims">0 × 0 px</span>
        </div>
      </div>
      <div class="editor-header-right">
        <button type="button" class="btn-editor-close" id="editorCloseBtn" aria-label="Tutup Editor">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="editor-toolbar">
      <div class="tool-segmented">
        <button type="button" class="btn-tool active" id="toolRestoreBtn" data-tool="restore" title="Kembalikan piksel dari gambar asli">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9.06 11.9 8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08"/><path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-.93-2.15l-.07-.07Z"/></svg>
          <span>Pulihkan (Restore)</span>
        </button>
        <button type="button" class="btn-tool" id="toolEraseBtn" data-tool="erase" title="Hapus sisa background">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
          <span>Hapus (Erase)</span>
        </button>
      </div>

      <div class="toolbar-sep"></div>

      <div class="brush-size-control">
        <label for="brushSizeInput">Ukuran: <strong id="brushSizeVal">30</strong>px</label>
        <input type="range" id="brushSizeInput" min="4" max="150" value="30" class="brush-range">
      </div>

      <div class="toolbar-sep"></div>

      <div class="editor-backdrop-switcher">
        <span class="toolbar-label">Latar:</span>
        <button type="button" class="btn-bd active" data-bd="checker" title="Checkerboard Transparan">
          <span class="bd-dot bd-chk"></span>
        </button>
        <button type="button" class="btn-bd" data-bd="ghost" title="Panduan Asli Samar (Ghost Mode)">
          <span class="bd-dot bd-ghost-icon">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3" fill="#38bdf8"/></svg>
          </span>
        </button>
        <button type="button" class="btn-bd" data-bd="white" title="Putih Solid">
          <span class="bd-dot bd-white"></span>
        </button>
        <button type="button" class="btn-bd" data-bd="black" title="Hitam Solid">
          <span class="bd-dot bd-black"></span>
        </button>
      </div>

      <div class="toolbar-sep"></div>

      <div class="history-controls">
        <button type="button" class="btn-icon-tb" id="undoBtn" disabled title="Urungkan (Ctrl+Z)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
        </button>
        <button type="button" class="btn-icon-tb" id="redoBtn" disabled title="Ulangi (Ctrl+Y)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
        </button>
        <button type="button" class="btn-icon-tb" id="resetEditorBtn" title="Reset ke Hasil Awal">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
      </div>
    </div>

    <!-- Viewport Stage -->
    <div class="editor-viewport bg-checker" id="editorViewport">
      <img class="ghost-guide-img hidden" id="ghostGuideImg" alt="" aria-hidden="true">
      <canvas id="paintCanvas" class="paint-canvas"></canvas>
      <div class="brush-cursor-ring hidden" id="brushCursorRing"></div>
    </div>

    <!-- Footer -->
    <div class="editor-footer">
      <div class="editor-hint">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#18181b" stroke-width="2.4" class="hint-icon" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" fill="#ffd23f"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
        <span>Gunakan kuas <strong>Pulihkan</strong> untuk mengembalikan bagian gambar dari foto asli.</span>
      </div>
      <div class="editor-actions">
        <button type="button" class="btn-editor-cancel" id="editorCancelBtn">Batal</button>
        <button type="button" class="btn-editor-save" id="editorSaveBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><polyline points="20 6 9 17 4 12"/></svg>
          <span>Simpan & Terapkan</span>
        </button>
      </div>
    </div>
  </div>
</div>
